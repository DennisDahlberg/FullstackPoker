services:
  db:
    image: postgres:alpine
    container_name: poker-db
    restart: always
    environment:
      POSTGRES_USER: dennis
      POSTGRES_PASSWORD: super_hemligt
      POSTGRES_DB: poker_db
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:alpine
    container_name: poker-redis
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: poker-api
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=poker_db;Username=dennis;Password=super_hemligt
      - Redis__ConnectionString=poker-redis:6379
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poker-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=https://pokergame.win/
volumes:
  postgres_data: